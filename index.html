<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مانیفست روزانه</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#26313E">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مانیفست">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root{
  --paper: #EDE6D5;
  --paper-dark: #E2D9C3;
  --ink: #26313E;
  --ink-soft: #56626D;
  --line: #C7BB9E;
  --brass: #A9793C;
  --green: #3F6B4F;
  --red: #A63D40;
  --card: #F6F1E5;
  --shadow: rgba(38,49,62,0.12);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:
    linear-gradient(180deg, var(--paper) 0%, var(--paper-dark) 100%);
  color:var(--ink);
  font-family:'Vazirmatn', sans-serif;
  min-height:100vh;
  padding:28px 16px 60px;
}

.wrap{max-width:980px;margin:0 auto;}

/* ---------- Header / manifest strip ---------- */
.header{
  background:var(--ink);
  color:var(--paper);
  border-radius:10px;
  padding:22px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  position:relative;
  overflow:hidden;
}
.header::before{
  content:"";
  position:absolute;
  inset:0;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(237,230,213,0.05) 38px, rgba(237,230,213,0.05) 40px);
  pointer-events:none;
}
.header-title{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing:3px;
  color:#C9BFA0;
  text-transform:uppercase;
  margin-bottom:4px;
}
.header-date{
  font-size:22px;
  font-weight:700;
}
.manifest-no{
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  color:#B7AE93;
  margin-top:4px;
  letter-spacing:1px;
}
.stamp{
  font-family:'JetBrains Mono', monospace;
  border:3px solid;
  border-radius:8px;
  padding:8px 16px;
  font-weight:700;
  font-size:13px;
  letter-spacing:2px;
  transform:rotate(-6deg);
  text-transform:uppercase;
  white-space:nowrap;
}
.stamp.cleared{border-color:#7FBF9B;color:#7FBF9B;}
.stamp.pending{border-color:#D9A441;color:#D9A441;}

.streak-box{
  text-align:left;
  font-family:'JetBrains Mono', monospace;
}
.streak-num{font-size:26px;font-weight:700;color:#E9B872;}
.streak-label{font-size:10px;letter-spacing:2px;color:#B7AE93;text-transform:uppercase;}

/* ---------- Weekly strip ---------- */
.week{
  display:flex;
  gap:8px;
  margin:18px 0 26px;
  align-items:center;
}
.week-label{font-size:12px;color:var(--ink-soft);margin-left:8px;white-space:nowrap;}
.week-dot{
  width:28px;height:28px;border-radius:6px;
  background:var(--card);
  border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono', monospace;
  font-size:10px;color:var(--ink-soft);
}
.week-dot.full{background:var(--green);border-color:var(--green);color:#fff;}
.week-dot.partial{background:#E9CD8E;border-color:#D9A441;color:var(--ink);}

/* ---------- Grid of holds (dimensions) ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:16px;
}
@media (max-width:700px){ .grid{grid-template-columns:1fr;} }

.hold{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px 18px 16px;
  box-shadow:0 2px 6px var(--shadow);
}
.hold-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:2px solid var(--ink);
  padding-bottom:8px;
  margin-bottom:12px;
}
.hold-title{font-weight:700;font-size:16px;}
.hold-code{
  font-family:'JetBrains Mono', monospace;
  font-size:10px;
  color:var(--brass);
  letter-spacing:1px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 0;
  border-bottom:1px dashed var(--line);
}
.item:last-of-type{border-bottom:none;}
.item input[type=checkbox]{
  width:18px;height:18px;
  accent-color:var(--green);
  flex-shrink:0;
  cursor:pointer;
}
.item span{flex:1;font-size:14px;}
.item span.done{text-decoration:line-through;color:var(--ink-soft);}
.item .del{
  cursor:pointer;color:var(--red);font-size:13px;opacity:0.6;
  border:none;background:none;font-family:inherit;
}
.item .del:hover{opacity:1;}

.add-row{display:flex;gap:6px;margin-top:10px;}
.add-row input{
  flex:1;border:1px solid var(--line);border-radius:6px;
  padding:7px 10px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);
}
.add-row button{
  border:1px solid var(--brass);background:var(--brass);color:#fff;
  border-radius:6px;padding:7px 14px;font-family:inherit;font-size:13px;cursor:pointer;
}
.add-row button:hover{opacity:0.88;}

.rating{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
}
.rating-label{font-size:12px;color:var(--ink-soft);}
.rating-stars{display:flex;gap:4px;}
.rating-stars button{
  width:26px;height:26px;border-radius:5px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono';
}
.rating-stars button.active{background:var(--brass);border-color:var(--brass);color:#fff;}

/* ---------- Note + report ---------- */
.note-card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:18px;margin-top:16px;
}
.note-card textarea{
  width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;
  padding:10px;font-family:inherit;font-size:13px;resize:vertical;background:#fff;color:var(--ink);
}
.note-title{font-weight:700;margin-bottom:8px;font-size:14px;}

.actions{
  display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;
}
.btn{
  border:none;border-radius:7px;padding:11px 18px;font-family:inherit;font-size:13px;
  cursor:pointer;font-weight:600;
}
.btn.primary{background:var(--ink);color:var(--paper);}
.btn.primary:hover{opacity:0.9;}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);}
.btn.ghost:hover{background:var(--ink);color:var(--paper);}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:8px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.25s;
  font-family:'JetBrains Mono', monospace;
}
.toast.show{opacity:1;}

.footnote{
  text-align:center;font-size:11px;color:var(--ink-soft);margin-top:24px;
  font-family:'JetBrains Mono', monospace;letter-spacing:0.5px;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <div class="header-title">مانیفست روزانه — بار زندگی</div>
      <div class="header-date" id="dateFa"></div>
      <div class="manifest-no" id="manifestNo"></div>
    </div>
    <div id="stampBox" class="stamp pending">در حال بارگیری</div>
    <div class="streak-box">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">روز پیاپی</div>
    </div>
  </div>

  <div class="week" id="weekStrip">
    <span class="week-label">۷ روز اخیر:</span>
  </div>

  <div class="grid" id="holds"></div>

  <div class="note-card">
    <div class="note-title">یادداشت امروز</div>
    <textarea id="dayNote" placeholder="یک خط درباره‌ی امروز — چی خوب پیش رفت، چی نه..."></textarea>
  </div>

  <div class="actions">
    <button class="btn primary" id="saveBtn">ثبت وضعیت امروز</button>
    <button class="btn ghost" id="reportBtn">کپی گزارش برای شریک پاسخگویی</button>
  </div>

  <div class="footnote">هر آیتم رو می‌تونی ویرایش، حذف یا اضافه کنی — این سیستم مال خودته</div>
</div>

<div class="toast" id="toast"></div>

<script>
const DIMENSIONS = [
  {key:'professional', title:'حرفه‌ای', code:'PRO-01', defaults:[
    'یک قدم برای مستندسازی/فرایندی‌کردن مجموعه برداشتم',
    'وضعیت واردات/گمرک رو چک کردم',
    'با یک مشتری، تامین‌کننده یا آدم جدید تعامل داشتم'
  ]},
  {key:'personal', title:'شخصی', code:'PER-02', defaults:[
    'زمانی برای یادگیری یا رشد فردی گذاشتم',
    'فعالیت بدنی یا ورزش داشتم'
  ]},
  {key:'emotional', title:'عاطفی', code:'EMO-03', defaults:[
    'صادقانه حال خودم رو چک کردم',
    'کاری برای آرامش ذهنی انجام دادم'
  ]},
  {key:'family', title:'خانواده', code:'FAM-04', defaults:[
    'زمان با خانواده گذروندم',
    'یک گفتگوی معنادار با یکی از اعضای خانواده داشتم'
  ]}
];

let config = null; // {items:{key:[{id,text}]}}
let today = null;  // 'YYYY-MM-DD'
let dayData = {checks:{}, ratings:{}, note:''};
let cloudAvailable = false;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function uid(){ return Math.random().toString(36).slice(2,9); }

function hasCloudStorage(){
  return typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=>reject(new Error('storage timeout')), ms))
  ]);
}

// Works inside the chat (persists across devices via window.storage) and
// also as a standalone downloaded file (falls back to this browser's localStorage).
// Every cloud call is time-boxed so a slow/blocked connection fails fast
// instead of leaving the page stuck waiting forever.
async function storageGetRaw(key){
  if(hasCloudStorage()){
    const r = await withTimeout(window.storage.get(key, false), 4000);
    return r.value;
  }
  const v = localStorage.getItem('daily-manifest:'+key);
  if(v===null) throw new Error('missing key: '+key);
  return v;
}

async function storageSetRaw(key, value){
  try{
    if(hasCloudStorage()){
      await withTimeout(window.storage.set(key, value, false), 4000);
    } else {
      localStorage.setItem('daily-manifest:'+key, value);
    }
    return true;
  }catch(e){
    console.error('storage save failed', e);
    return false;
  }
}

async function loadConfig(){
  try{
    const raw = await storageGetRaw('config');
    const parsed = JSON.parse(raw);
    config = (parsed && typeof parsed === 'object') ? parsed : {};
  }catch(e){
    config = {};
  }
  const patched = ensureConfigDefaults();
  if(patched) await storageSetRaw('config', JSON.stringify(config));
}

function ensureConfigDefaults(){
  if(!config.items || typeof config.items !== 'object') config.items = {};
  let patched = false;
  DIMENSIONS.forEach(d=>{
    if(!Array.isArray(config.items[d.key]) || config.items[d.key].length === 0){
      config.items[d.key] = d.defaults.map(t=>({id:uid(), text:t}));
      patched = true;
    }
  });
  return patched;
}

async function saveConfig(){
  await storageSetRaw('config', JSON.stringify(config));
}

async function loadDay(key){
  try{
    const raw = await storageGetRaw('day:'+key);
    return JSON.parse(raw);
  }catch(e){
    return {checks:{}, ratings:{}, note:''};
  }
}

async function saveDay(key, data){
  return await storageSetRaw('day:'+key, JSON.stringify(data));
}

function renderHeader(){
  const now = new Date();
  let faDate;
  try{
    faDate = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {year:'numeric', month:'long', day:'numeric', weekday:'long'}).format(now);
  }catch(e){
    faDate = now.toLocaleDateString('fa-IR');
  }
  document.getElementById('dateFa').textContent = faDate;
  document.getElementById('manifestNo').textContent = 'MANIFEST NO. ' + today.replace(/-/g,'');
}

function allChecked(){
  let total = 0, done = 0;
  DIMENSIONS.forEach(d=>{
    (config.items[d.key]||[]).forEach(it=>{
      total++;
      if(dayData.checks[it.id]) done++;
    });
  });
  return total>0 && done===total;
}

function updateStamp(){
  const box = document.getElementById('stampBox');
  if(allChecked()){
    box.textContent = 'cleared';
    box.className = 'stamp cleared';
  } else {
    box.textContent = 'pending';
    box.className = 'stamp pending';
  }
}

function renderHolds(){
  const holds = document.getElementById('holds');
  holds.innerHTML = '';
  DIMENSIONS.forEach(d=>{
   try{
    const items = Array.isArray(config.items[d.key]) ? config.items[d.key] : [];
    const card = document.createElement('div');
    card.className = 'hold';

    const head = document.createElement('div');
    head.className = 'hold-head';
    head.innerHTML = `<span class="hold-title">${d.title}</span><span class="hold-code">${d.code}</span>`;
    card.appendChild(head);

    items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'item';
      const checked = !!dayData.checks[it.id];
      row.innerHTML = `
        <input type="checkbox" ${checked?'checked':''} data-id="${it.id}">
        <span class="${checked?'done':''}">${it.text}</span>
        <button class="del" data-id="${it.id}" data-dim="${d.key}">حذف</button>
      `;
      row.querySelector('input').addEventListener('change', (e)=>{
        dayData.checks[it.id] = e.target.checked;
        row.querySelector('span').classList.toggle('done', e.target.checked);
        updateStamp();
      });
      row.querySelector('.del').addEventListener('click', ()=>{
        config.items[d.key] = config.items[d.key].filter(x=>x.id!==it.id);
        delete dayData.checks[it.id];
        saveConfig();
        renderHolds();
        updateStamp();
      });
      card.appendChild(row);
    });

    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    addRow.innerHTML = `<input type="text" placeholder="آیتم جدید برای ${d.title}..." data-dim="${d.key}"><button data-dim="${d.key}">افزودن</button>`;
    const input = addRow.querySelector('input');
    const btn = addRow.querySelector('button');
    const addItem = ()=>{
      const val = input.value.trim();
      if(!val) return;
      config.items[d.key].push({id:uid(), text:val});
      input.value='';
      saveConfig();
      renderHolds();
    };
    btn.addEventListener('click', addItem);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addItem(); });
    card.appendChild(addRow);

    const rating = document.createElement('div');
    rating.className = 'rating';
    const stars = [1,2,3,4,5].map(n=>{
      const active = dayData.ratings[d.key]===n ? 'active' : '';
      return `<button data-dim="${d.key}" data-n="${n}" class="${active}">${n}</button>`;
    }).join('');
    rating.innerHTML = `<span class="rating-label">حس امروز به این بخش</span><div class="rating-stars">${stars}</div>`;
    rating.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        dayData.ratings[d.key] = parseInt(b.dataset.n);
        renderHolds();
      });
    });
    card.appendChild(rating);

    holds.appendChild(card);
   }catch(err){
    console.error('render failed for dimension', d.key, err);
   }
  });
  updateStamp();
}

async function renderWeek(){
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '<span class="week-label">۷ روز اخیر:</span>';
  const keys = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    keys.push(d.toISOString().slice(0,10));
  }
  let streak = 0;
  let counting = true;
  const checkedKeys = [...keys].reverse();
  for(const k of keys){
    const data = k===today ? dayData : await loadDay(k);
    let total=0, done=0;
    DIMENSIONS.forEach(d=>{
      (config.items[d.key]||[]).forEach(it=>{ total++; if(data.checks[it.id]) done++; });
    });
    const dot = document.createElement('div');
    const ratio = total>0 ? done/total : 0;
    dot.className = 'week-dot ' + (ratio===1 && total>0 ? 'full' : (ratio>0 ? 'partial' : ''));
    dot.textContent = k.slice(8,10);
    strip.appendChild(dot);
  }
  for(const k of checkedKeys){
    const data = k===today ? dayData : await loadDay(k);
    let total=0, done=0;
    DIMENSIONS.forEach(d=>{
      (config.items[d.key]||[]).forEach(it=>{ total++; if(data.checks[it.id]) done++; });
    });
    if(total>0 && done===total){ streak++; } else { break; }
  }
  document.getElementById('streakNum').textContent = streak;
}

function attachListeners(){
  document.getElementById('dayNote').addEventListener('input', (e)=>{
    dayData.note = e.target.value;
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const ok = await saveDay(today, dayData);
    toast(ok ? 'ثبت شد ✓' : 'ذخیره نشد — دوباره امتحان کن');
    await renderWeek();
  });

  document.getElementById('reportBtn').addEventListener('click', async ()=>{
    let lines = [];
    lines.push('گزارش روزانه — ' + today);
    DIMENSIONS.forEach(d=>{
      const items = config.items[d.key]||[];
      const done = items.filter(it=>dayData.checks[it.id]).length;
      const rate = dayData.ratings[d.key] ? ` | امتیاز: ${dayData.ratings[d.key]}/5` : '';
      lines.push(`${d.title}: ${done}/${items.length}${rate}`);
    });
    if(dayData.note) lines.push('یادداشت: ' + dayData.note);
    const text = lines.join('\n');
    try{
      await navigator.clipboard.writeText(text);
      toast('گزارش کپی شد — آماده‌ی ارسال');
    }catch(e){
      toast('کپی خودکار کار نکرد، متن رو دستی کپی کن');
    }
  });
}

async function init(){
  today = todayKey();
  cloudAvailable = hasCloudStorage();

  // Step 1 — render instantly with in-memory defaults. The checklist must
  // never sit blank while waiting on a network call.
  config = {items:{}};
  ensureConfigDefaults();
  dayData = {checks:{}, ratings:{}, note:''};
  renderHeader();
  renderHolds();
  document.getElementById('weekStrip').innerHTML = '<span class="week-label">۷ روز اخیر:</span>';
  attachListeners();

  // Step 2 — load anything saved, in the background, and refresh the view
  // if it arrives. A timeout (see storageGetRaw) keeps this from hanging.
  try{
    await loadConfig();
    dayData = await loadDay(today);
    document.getElementById('dayNote').value = dayData.note || '';
    renderHolds();
    await renderWeek();
    if(!cloudAvailable){
      toast('حالت آفلاین: داده‌ها روی همین مرورگر ذخیره می‌شن');
    }
  }catch(err){
    console.error('background load failed', err);
    toast('اتصال به حافظه برقرار نشد — نسخه‌ی موقت نمایش داده شد');
  }
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('sw registration skipped', e));
  });
}
</script>
</body>
</html>
